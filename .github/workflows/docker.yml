name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  test:
    # A versioned label, so Renovate offers the next Ubuntu as a PR that CI tests first.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: The tests and the image use the same Bun
        run: test "$(grep -c "^FROM oven/bun:$(cat .bun-version)-" Dockerfile)" = 2
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun run build
      - run: bun run test
      - name: Install Chromium for the browser scenarios
        run: bunx playwright-core install --with-deps chromium-headless-shell
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          if-no-files-found: ignore

  # Docker's reusable workflow: one native runner per platform, a merged multi-platform manifest,
  # provenance and SBOM attestations signed with the job's OIDC identity. A pull request builds without pushing.
  build:
    needs: test
    uses: docker/github-builder/.github/workflows/build.yml@bb1eb9fb69408ac52395fb21f49c6b52d564529a # v1.20.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      sbom: true
      set-meta-labels: true
      meta-images: ghcr.io/thephaseless/c-oop
      # `latest` follows the newest version tag (the action's default flavor).
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # The one check a ruleset requires: a skipped job would satisfy a required check of its own,
  # and the build jobs carry runner labels in their names.
  ci-ok:
    if: always()
    needs: [test, build]
    runs-on: ubuntu-26.04
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.build.result }}" = success
